name: Release package

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
          scope: "@tietoware"

      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION="v$(node -p "require('./package.json').version")"
          echo "GITHUB_REF_NAME: $GITHUB_REF_NAME"
          echo "package.json version: $PACKAGE_VERSION"
          if [ "$GITHUB_REF_NAME" != "$PACKAGE_VERSION" ]; then
            echo "Error: tag must match package.json version (expected $PACKAGE_VERSION)." >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run pack:check

      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published package
        shell: bash
        run: |
          PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
          for attempt in {1..12}; do
            if npm view "@tietoware/forms@${PACKAGE_VERSION}" version --registry=https://registry.npmjs.org; then
              exit 0
            fi
            echo "Version ${PACKAGE_VERSION} is not visible on npm yet (attempt ${attempt}/12); retrying in 10 seconds."
            sleep 10
          done
          echo "Version ${PACKAGE_VERSION} was not found on npm after waiting for publication to propagate." >&2
          exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
